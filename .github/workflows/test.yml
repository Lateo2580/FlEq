name: Test

on:
  push:
    branches: [main]
    # 文書だけの変更では回さない (2026-09-16 作者裁定 A)。reconstruction/ の JSON・checker は対象のまま
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # engine 3 回 + display を直列に回すと 1 run 約 15 分だったので並列化 (2026-09-16 作者裁定 B)。
    # install/build/typecheck は合計 1 分未満なので各 job で繰り返す方が単純
    strategy:
      fail-fast: false
      matrix:
        suite: [engine, engine-shuffle, engine-strict, display]
    name: test (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (engine)
        run: npm ci --ignore-scripts

      - name: Install (display)
        run: npm ci --ignore-scripts --prefix display

      - name: Build
        run: npm run build

      - name: Typecheck (src + test)
        run: npm run typecheck:test

      - name: Typecheck (display)
        run: npm run typecheck --prefix display

      # engine-shuffle: 実行順をシャッフルして走らせる。デフォルト順では緑なのに順序を変えると
      # 落ちるテストが実在した (2026-07-25)。永続化・共有状態・module スコープの
      # 変数を触ったときに露出するので、CI では常に通す
      # engine-strict: 待機 sweep の owner version 比較を version 抜き payload の全文比較と突き合わせ、
      # 不一致なら throw する strict モード (#13 段階 4-3)。既定 off なので通常の
      # npm test では回らない。owner に mutation 経路が増えて bump 漏れが出ると
      # sweepAll が変更を取りこぼす (commit されない) ため、CI では常に通す (2026-09-09)
      - name: Test (${{ matrix.suite }})
        run: |
          case "${{ matrix.suite }}" in
            engine) npm test ;;
            engine-shuffle) npm run test:shuffle ;;
            engine-strict) FLEQ_STANDBY_SWEEP_STRICT=1 npm test ;;
            display) npm test --prefix display ;;
          esac
