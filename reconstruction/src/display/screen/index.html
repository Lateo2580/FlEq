<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>FlEq</title>
<style>
  /* px と色は tokens.ts の値を main.ts が起動の時に CSS の変数へ入れる。ここに数と色の字を直に書かない（P4-DS-AC01 (5)）。 */
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--c-ground-sea); }
  /* 画面の根（DS-CSS-01）: 字 ink、tabular-nums、keep-all、行の高さ 1.25 */
  #screen { position: absolute; left: 0; top: 0; width: var(--screen-w); height: var(--screen-h); transform-origin: 0 0;
    color: var(--c-ink); font-family: "BIZ UDPGothic", sans-serif; font-size: var(--card-text); line-height: 1.25; word-break: keep-all;
    font-variant-numeric: tabular-nums; }
  /* 層ごとの container。中間の層は cover の切り抜き（clip-path）を main.ts が当てる */
  #cards-middle, #cards-top { position: absolute; left: 0; top: 0; width: var(--screen-w); height: var(--screen-h); }
  #cards-middle { z-index: 1; }
  #cards-top { z-index: 2; }
  /* カードの枠（DS-CSS-02）: 面は不透明。線は中身を縮めないよう内側の outline で引く（行の高さの和＝カードの高さ）。
     暗くするのは明るさを下げる形で、不透明度では透かさない（DS-OPEN-62） */
  .card { position: absolute; box-sizing: border-box; overflow: hidden; background: var(--c-surface); border-radius: var(--card-radius);
    outline: var(--card-border) solid var(--c-surface-edge); outline-offset: calc(-1 * var(--card-border)); }
  .card.dim { filter: brightness(var(--dim)); }
  .row { display: flex; align-items: baseline; box-sizing: border-box; overflow: hidden; padding: 0 var(--space-s5); }
  .r-head { justify-content: space-between; gap: var(--space-s4); }
  .r-divider { border-top: var(--card-divider) solid var(--c-divider); padding-top: var(--space-s3); }
  .t-ink { color: var(--c-ink); }
  .t-ink-muted { color: var(--c-ink-muted); }
  .t-head { font-size: var(--card-head-text); font-weight: 700; }
  .t-sub { font-size: var(--card-text); color: var(--c-ink-muted); }
  .mark { position: absolute; display: flex; align-items: center; color: var(--c-ink-muted); }
  .mark.last { left: 0; right: var(--space-s5); bottom: 0; height: var(--page-mark-row); justify-content: flex-end; }
  .mark.head { right: var(--space-s5); top: var(--card-border); }
  .dot { margin-left: var(--dots-gap); box-sizing: border-box; border-radius: 50%; width: var(--dots-off); height: var(--dots-off);
    border: var(--dots-line) solid var(--c-ink-muted); }
  .dot.on { width: var(--dots-on); height: var(--dots-on); background: var(--c-ink); border-color: var(--c-ink); }
  /* 時計（DS-CSS-12）: 年月日 30px・400、時分 56px・700、字の下の線で揃え、上の内側 6px */
  #clock { position: absolute; box-sizing: border-box; display: flex; justify-content: center; align-items: baseline; gap: var(--clock-text-gap);
    padding-top: var(--clock-text-pad-top); white-space: nowrap; z-index: 3; background: var(--c-surface); border-radius: var(--card-radius);
    outline: var(--card-border) solid var(--c-surface-edge); outline-offset: calc(-1 * var(--card-border)); color: var(--c-ink-clock); }
  #clock-date { font-size: var(--clock-text-date); font-weight: 400; }
  #clock-time { font-size: var(--clock-text-time); font-weight: 700; line-height: 1; }
  /* 状態の札の置き場: 上端の中央。出すものがあるときだけ main.ts が置く（H01・H02）。字は根の大きさ */
  #status { position: absolute; left: var(--status-center-x); top: var(--status-top); transform: translateX(-50%); z-index: 3;
    padding: var(--space-s3); background: var(--c-surface); border: var(--card-border) solid var(--c-surface-edge);
    border-radius: var(--card-radius); white-space: nowrap; }
</style>
</head>
<body>
<div id="screen">
  <div id="cards-middle"></div>
  <div id="cards-top"></div>
  <div id="clock"><span id="clock-date"></span><span id="clock-time"></span></div>
</div>
<script type="module" src="/display/main.js"></script>
</body>
</html>
